[tools]
java = "temurin-17.0.21+9"
node = "24.22.1"
"npm:@fission-ai/openspec" = "1.14.3"

[env]
OPENSPEC_TELEMETRY = "0"
REDOCLY_TELEMETRY = "off"
REDOCLY_SUPPRESS_UPDATE_NOTICE = "true"
DO_NOT_TRACK = "1"

# OpenSpec reads profile and delivery from the machine's global config
# (~/.config/openspec/config.json). The tasks set them before init and before
# every update so that every machine and the CI generate the same skills.
[tasks.openspec-profile]
description = "Set the OpenSpec profile and delivery for this project (before openspec init)"
run = [
  "openspec config set profile core",
  "openspec config set delivery both",
]

[tasks.openspec-sync]
description = "Adapt skills and commands to the pinned OpenSpec version and the project profile"
depends = ["openspec-profile"]
run = "openspec update --force"
