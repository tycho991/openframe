name: ci
# Pull requests run as pull_request only; push runs only for main, so a push to a PR branch does not start CI twice.
on:
  push:
    branches: [main]
  pull_request:
  # renovate-artifacts.yml starts the checks after its push to a Renovate branch, which itself starts no workflow.
  workflow_dispatch:
  # The release gate: release-please.yml runs these checks on the release commit before it builds the release.
  workflow_call:
    inputs:
      ref:
        description: Commit to check, by default the one that started the run.
        type: string
        required: false
permissions:
  contents: read
# A new push to a pull request cancels its older run. On main every commit gets a group of its own, so no run there is
# dropped. The fixed prefix keeps the group apart from a workflow that might call this one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # UTF-8 everywhere, so that file names and test data with non-ASCII characters behave the same.
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  # mise itself, pinned like the tools it installs; Renovate raises it (customManagers in renovate.json).
  MISE_VERSION: "2026.10.21"
  OPENSPEC_TELEMETRY: "0"
  REDOCLY_TELEMETRY: "off"
  REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
  DO_NOT_TRACK: "1"

jobs:
  gradle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # Java and Node pinned exactly as in .mise.toml.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: java node
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Check and build
        run: |
          set -o pipefail
          ./gradlew check :android:assembleDebug --console=plain 2>&1 | tee build.log
      - name: Summarize errors
        if: failure()
        run: |
          grep -nE "^e: |^ERROR|error:|What went wrong|FAILED|Lint found" -A6 build.log | head -300
          cat android/build/reports/lint-results-debug.txt 2>/dev/null | head -200 || true
      - name: Check APK
        run: |
          apk=android/build/outputs/apk/debug/android-debug.apk
          aapt2=$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2
          "$aapt2" dump badging "$apk" | tee badging.txt | grep -E "^package|sdkVersion|native-code" || true
          grep -q "name='io.github.tycho991.openframe'" badging.txt
          grep -q "^minSdkVersion:'21'" badging.txt
          # One version source (app-release): version.txt names the APK's version, its code is X*10000 + Y*100 + Z,
          # and the release pull request keeps the web UI's package files equal to it. A JSONPath of release-please
          # that matches nothing would fail silently, so the three package fields are checked here.
          version=$(cat version.txt)
          IFS=. read -r major minor patch <<<"$version"
          code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          echo "version.txt: $version, version code $code"
          grep -q "versionCode='$code' versionName='$version'" badging.txt
          for field in "webadmin/package.json .version" "webadmin/package-lock.json .version" \
            'webadmin/package-lock.json .packages[""].version'; do
            read -r file path <<<"$field"
            found=$(jq -r "$path" "$file")
            echo "$file $path: $found"
            test "$found" = "$version" || { echo "$file $path is $found, version.txt says $version" >&2; exit 1; }
          done
          # No native libraries: runs on all ABIs. (A bare `! grep` would not stop the script under `bash -e`.)
          if grep -q "^native-code" badging.txt; then exit 1; fi
          unzip -l "$apk" | grep -E "assets/webadmin/(index.html|assets/)" | head -5
          unzip -l "$apk" | grep -q "assets/webadmin/index.html"
          # Licences of the bundled libraries, the place data, the typeface and the icon set (visual-design).
          listing=$(unzip -Z1 "$apk")
          for f in third-party-android.txt third-party-webadmin.txt GeoNames.txt Inter-OFL.txt MaterialSymbols-LICENSE.txt; do
            grep -qxF "assets/webadmin/licenses/$f" <<<"$listing" || { echo "Missing in the APK: $f" >&2; exit 1; }
          done
      # The sign job's shell functions with this runner's build tools: their output format changed from 36 to 37 and
      # stopped the 0.2.1 release.
      - name: Check the release functions
        run: |
          ./gradlew :android:assembleRelease --console=plain
          scripts/release-functions-test.sh
      # The reports always, the debug APK only from main: a pull request run would offer a build of unreviewed code.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gradle-reports
          path: |
            **/build/reports/
            ${{ github.event_name == 'push' && 'android/build/outputs/apk/debug/*.apk' || '' }}
          if-no-files-found: ignore

  webadmin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webadmin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # Java and Node pinned exactly as in .mise.toml.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: java node
      # Install scripts stay off (webadmin/.npmrc); the registry signatures of the installed packages are checked.
      - run: npm ci
      - run: npm audit signatures
      # ESLint, Prettier and Redocly on the API contract.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The Playwright version from the lock file names the container image of the e2e job, so the two never drift apart.
  playwright-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          sparse-checkout: webadmin/package-lock.json
          sparse-checkout-cone-mode: false
      - id: read
        run: echo "version=$(jq -r '.packages["node_modules/playwright-core"].version' webadmin/package-lock.json)" >> "$GITHUB_OUTPUT"

  # One job per browser, each with its own test server, in Playwright's image: browsers and their system libraries are
  # in it, so nothing is fetched from the Ubuntu mirror (`install --with-deps` hung there for up to 43 minutes).
  e2e:
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      # The runner's user, who owns the workspace.
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    env:
      # The test server needs only :core, not :android.
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
      # Inside the container the workspace is under /__w, not where github.workspace points.
      MISE_TRUSTED_CONFIG_PATHS: /__w
    defaults:
      run:
        working-directory: webadmin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # Java and Node pinned exactly as in .mise.toml.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: java node
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - run: npm ci
      - run: npm run build
      - run: npx playwright test --project="$PROJECT"
        env:
          PROJECT: ${{ matrix.project }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: webadmin/playwright-report/
