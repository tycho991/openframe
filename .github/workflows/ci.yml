name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  # Testnamen mit Umlauten werden zu Klassendateien mit Umlauten.
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  OPENSPEC_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Java und Node genau wie in .mise.toml gepinnt.
      - uses: jdx/mise-action@v5
      - uses: gradle/actions/setup-gradle@v5
      - name: Prüfen und bauen
        run: |
          set -o pipefail
          ./gradlew check :android:assembleDebug --console=plain 2>&1 | tee build.log
      - name: Fehler zusammenfassen
        if: failure()
        run: |
          grep -nE "^e: |^ERROR|error:|What went wrong|FAILED|Lint found" -A6 build.log | head -300
          cat android/build/reports/lint-results-debug.txt 2>/dev/null | head -200 || true
      - name: APK prüfen
        run: |
          apk=android/build/outputs/apk/debug/android-debug.apk
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2
          "$aapt2" dump badging "$apk" | tee badging.txt | grep -E "^package|sdkVersion|native-code" || true
          grep -q "name='io.github.tycho991.openframe'" badging.txt
          grep -q "^minSdkVersion:'21'" badging.txt
          # Keine nativen Bibliotheken: läuft auf allen ABIs.
          ! grep -q "^native-code" badging.txt
          unzip -l "$apk" | grep -E "assets/webadmin/(index.html|assets/)" | head -5
          unzip -l "$apk" | grep -q "assets/webadmin/index.html"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-reports
          path: |
            **/build/reports/
            android/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  webadmin:
    runs-on: ubuntu-latest
    env:
      # Der Testserver braucht nur :core, nicht :android.
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
    defaults:
      run:
        working-directory: webadmin
    steps:
      - uses: actions/checkout@v7
      # Java und Node genau wie in .mise.toml gepinnt.
      - uses: jdx/mise-action@v5
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: webadmin/playwright-report/
