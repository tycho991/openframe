name: pr-title
# Pull requests are squash-merged with their title as the commit subject, and release-please reads the version step
# from it (app-release, "Conventional pull request titles"). No checkout and no token: the title comes from the event.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions: {}
jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|ci|build|chore)(\([a-z0-9-]+\))?!?: .+'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "Title: $TITLE"
          else
            echo "The title \"$TITLE\" is not a Conventional Commit." >&2
            echo "Expected: type(scope)!: description, scope and ! optional, for example \"fix: keep the display off\"." >&2
            echo "Types: feat, fix, perf (release), refactor, docs, test, ci, build, chore (no release)." >&2
            exit 1
          fi
