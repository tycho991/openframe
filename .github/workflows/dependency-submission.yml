name: dependency-submission
# Sends the resolved Gradle dependencies to the dependency graph, so that Dependabot alerts cover them too
# (prepare-public-release, design decision 8). GitHub offers no automatic submission for Gradle here.
on:
  push:
    branches: [main]
permissions:
  contents: read
# Only the newest state of main matters for the graph.
concurrency:
  group: dependency-submission
  cancel-in-progress: true
env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  # mise itself, pinned like the tools it installs; Renovate raises it (customManagers in renovate.json).
  MISE_VERSION: "2026.10.17"
  DO_NOT_TRACK: "1"

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Writing to the dependency graph needs contents: write, in this job only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Java as in .mise.toml; resolving the dependencies builds nothing, so Node is not needed.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: java
      - uses: gradle/actions/dependency-submission@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
