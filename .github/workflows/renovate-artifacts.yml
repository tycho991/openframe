name: renovate-artifacts
# Renovate cannot regenerate two kinds of files: gradle/verification-metadata.xml (its own attempt runs only
# `dependencies`, from shared servers that Maven Central answers with 429) and the skills that `openspec update` writes.
# This workflow regenerates them on Renovate's branches and pushes them as a commit of its own.
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}
# A new push of Renovate cancels the older run; its push would fail anyway, the branch has moved on.
concurrency:
  group: renovate-artifacts-${{ github.head_ref }}
  cancel-in-progress: true
env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  # mise itself, pinned like the tools it installs; Renovate raises it (customManagers in renovate.json).
  MISE_VERSION: "2026.11.4"
  OPENSPEC_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  # Runs the build of the updated dependencies, so it gets no write access: it only hands over a patch.
  regenerate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: java node npm:@fission-ai/openspec
      - name: Changed files
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE...$HEAD" | tee changed.txt
          if grep -qE '^(gradle/libs\.versions\.toml|gradle/wrapper/gradle-wrapper\.properties|gradle\.properties|(.*/)?[^/]+\.gradle\.kts)$' changed.txt; then
            echo "gradle=true" >> "$GITHUB_OUTPUT"
          fi
          rm changed.txt
      # The command from the README, with a fresh Gradle home: an existing cache would be recorded as it is.
      - name: Regenerate the dependency checksums
        if: steps.changed.outputs.gradle == 'true'
        run: |
          GRADLE_USER_HOME=$(mktemp -d) ./gradlew --no-configuration-cache --no-build-cache --console=plain \
            --write-verification-metadata sha256 help check :android:assembleDebug
      # Cheap, so always: a new openspec version and a changed profile both show up here.
      - name: Regenerate the skills
        run: mise run --skip-tools openspec-sync
      - name: Patch
        id: patch
        run: |
          git add -A
          git diff --cached --stat
          git diff --cached --binary > "$RUNNER_TEMP/regenerated.patch"
          if [ -s "$RUNNER_TEMP/regenerated.patch" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.patch.outputs.changed == 'true'
        with:
          name: regenerated-patch
          path: ${{ runner.temp }}/regenerated.patch
          retention-days: 3
    outputs:
      changed: ${{ steps.patch.outputs.changed }}

  # Has write access and runs no code of the dependencies: it checks the patch, commits and pushes it.
  push:
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: regenerated-patch
          path: ${{ runner.temp }}/patch
      # Only the two kinds of generated files, only as regular files.
      - name: Apply the patch
        run: |
          git apply --index "$RUNNER_TEMP/patch/regenerated.patch"
          git diff --cached --raw
          # Fields: :old-mode new-mode old-sha new-sha status path. A deletion has the new mode 000000.
          bad=$(git diff --cached --raw --no-renames | awk '$2 != "100644" && $5 != "D"')
          paths=$(git diff --cached --name-only --no-renames)
          outside=$(grep -vE '^(gradle/verification-metadata\.xml|\.claude/skills/[^/]+/SKILL\.md|\.claude/commands/[a-z0-9/-]+\.md)$' <<<"$paths" || true)
          if [ -n "$outside" ] || [ -n "$bad" ]; then
            echo "The patch touches more than the generated files:" >&2
            echo "$outside$bad" >&2
            exit 1
          fi
      - name: Compare new checksums with the repositories
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --cached --quiet -- gradle/verification-metadata.xml; then exit 0; fi
          git show "$HEAD:gradle/verification-metadata.xml" > "$RUNNER_TEMP/old.xml"
          python3 -I scripts/verify-new-checksums.py "$RUNNER_TEMP/old.xml" gradle/verification-metadata.xml
      # A push with GITHUB_TOKEN starts no workflow, a workflow_dispatch does. Renovate leaves the commit alone and keeps
      # rebasing (gitIgnoredAuthors in renovate.json).
      - name: Commit, push and start the checks
        id: commit
        env:
          BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore(deps): regenerate dependency checksums and skills" \
            -m "Regenerated by the renovate-artifacts workflow."
          sha=$(git rev-parse HEAD)
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          for workflow in ci openspec-drift; do
            gh api "repos/$REPOSITORY/statuses/$sha" -f state=pending -f context="$workflow" \
              -f description="Started by renovate-artifacts" > /dev/null
            gh workflow run "$workflow.yml" --repo "$REPOSITORY" --ref "$BRANCH"
          done
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
    outputs:
      sha: ${{ steps.commit.outputs.sha }}

  # The push also creates pull_request runs, which wait for an approval (github-actions[bot] counts as an external
  # contributor). Their empty check suites hide the dispatched runs on the pull request, whose status would then read
  # green without them. A commit status for each dispatched run carries its result to the pull request.
  report:
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      statuses: write
    steps:
      - name: Wait for the checks and report them
        env:
          SHA: ${{ needs.push.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          status() {
            gh api "repos/$REPOSITORY/statuses/$SHA" -f state="$1" -f context="$2" -f description="$3" \
              ${4:+-f target_url="$4"} > /dev/null
          }
          for workflow in ci openspec-drift; do
            id=
            for _ in $(seq 30); do
              id=$(gh run list --repo "$REPOSITORY" --workflow "$workflow.yml" --commit "$SHA" --event workflow_dispatch \
                --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              [ -n "$id" ] && break
              sleep 10
            done
            if [ -z "$id" ]; then
              status error "$workflow" "The dispatched run did not start"
              continue
            fi
            url="https://github.com/$REPOSITORY/actions/runs/$id"
            if gh run watch "$id" --repo "$REPOSITORY" --exit-status --interval 30 > /dev/null; then
              status success "$workflow" "Dispatched run passed" "$url"
            else
              status failure "$workflow" "Dispatched run failed" "$url"
            fi
          done
